name: Publish Docker image

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: Docker image tag (e.g. v1.2.3)
        default: latest

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            refstek.house/vetles-roetter:latest
            refstek.house/vetlemangrud/vetles-roetter:${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
