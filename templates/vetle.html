<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <title>Vetle ONLY</title>
  </head>
  <body>
    {{if .IsVetle}}
    <p><a href="/">Tilbake</a></p> 
    {{end}}
    <header>
      <h1>Vetle-sone</h1>
    </header>
    <main>
      
      {{if .IsVetle}}
        <form method="post">
          <button name="intent" value="eatCarrot" type="submit">Spis gulrot</button>
        </form>
        <h2>Siste Gulrøtter</h2>
        <form method="post">
          <input type="hidden" name="intent" value="deleteCarrot" />
          <table>
            <tr><th>Tid</th><th>Sletteknappp!!</th></tr>
            {{range .LastCarrots}}
              <tr>
                <td>{{.EatenAt.Local.Format "02.01.2006 15.04"}}</td>
                <td>
                  <button type="Submit" name="id" value={{.ID}}>Slett</button>
                </td>
              </tr>
            {{end}}
          </table>
        </form>
      {{else}}
        <p>Bevis at du er Vetle!</p>
        <form method="post">
          <input type="password" name="key" value=""> 
          <button name="intent" value="login" type="submit">Sjekk</button>
        </form>
      {{end}}
    </main>
  </body>
</html>
